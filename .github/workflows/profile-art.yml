name: Profile art (3D contributions + snake)

on:
  schedule:
    - cron: "23 21 * * *"   # daily, 00:23 Baghdad time
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"
      - "dist/**"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Add a PROFILE_TOKEN secret (classic PAT, read:user + repo) to count private-repo work too
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#B89528&color_dots=#F5F3EC,#8BC4EC,#4F9ED5,#1A63A0,#002C8C
            dist/snake-dark.svg?palette=github-dark&color_snake=#D4AF37&color_dots=#0C162C,#17598F,#29709F,#4F9ED5,#8BC4EC

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib dist
          git diff --cached --quiet || git commit -m "chore: refresh profile art"
          git push
