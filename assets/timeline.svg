<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="584" viewBox="0 0 1200 584" role="img" aria-label="Timeline from photography in 2019 to Alpha Board in 2026"><title>Timeline from photography in 2019 to Alpha Board in 2026</title><style>text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace} 
    .it{opacity:0;animation:in .7s cubic-bezier(.2,0,0,1) forwards}
    @keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
    .grow{stroke-dasharray:2000;stroke-dashoffset:2000;animation:grow 3.2s ease forwards}
    @keyframes grow{to{stroke-dashoffset:0}}
    .dot{animation:dp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
