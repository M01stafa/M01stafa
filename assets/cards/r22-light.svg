<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="430" viewBox="0 0 590 430" role="img" aria-label="R-22 P-h Chart &amp; Cycle Simulator"><title>R-22 P-h Chart &amp; Cycle Simulator</title><style>text{font-family:Geist, 'Geist Sans', system-ui, -apple-system, 'Segoe UI', Ubuntu, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} 
.fade{opacity:0;animation:fadeUp .8s cubic-bezier(.2,0,0,1) forwards}
