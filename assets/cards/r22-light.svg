ext><text x="28" y="258" font-size="13" class="mono" fill="#1A47B8">Mollier diagram · vapor-compression cycle</text></g><g class="fade" style="animation-delay:0.35s"><text x="28" y="288" font-size="15" fill="#5C677D">Pressure–enthalpy chart for R-22 with a live 4-point</text></g><g class="fade" style="animation-delay:0.43s"><text x="28" y="310" font-size="15" fill="#5C677D">refrigeration-cycle solver: COP, compressor work, refrigeration</text></g><g class="fade" style="animation-delay:0.51s"><text x="28" y="332" font-size="15" fill="#5C677D">capacity, and a PDF report of every step.</text></g><g class="fade" style="animation-delay:.6s"><rect x="28" y="345" width="4" height="24" rx="2" fill="#1A47B8"/><text x="42" y="362" font-size="15" font-weight="600" fill="#0B132B">Same idea as the psychrometric tool: minutes instead of hours</text></g><g class="chip" style="animation-delay:0.60s"><rect x="28" y="382" width="88" height="24" rx="8" fill="#1A47B8" fill-opacity=".08" stroke="#1A47B8" stroke-opacity=".35"/><text x="72" y="398.3" text-anchor="middle" font-size="12" fill="#1A47B8" class="mono">Vanilla JS</text></g><g class="chip" style="animation-delay:0.68s"><rect x="124" y="382" width="88" height="24" rx="8" fill="#1A47B8" fill-opacity=".08" stroke="#1A47B8" stroke-opacity=".35"/><text x="168" y="398.3" text-anchor="middle" font-size="12" fill="#1A47B8" class="mono">SVG engine</text></g><g class="chip" style="animation-delay:0.76s"><rect x="220" y="382" width="109.6" height="24" rx="8" fill="#1A47B8" fill-opacity=".08" stroke="#1A47B8" stroke-opacity=".35"/><text x="274.8" y="398.3" text-anchor="middle" font-size="12" fill="#1A47B8" class="mono">Spline models</text></g><g class="chip" style="animation-delay:0.84s"><rect x="337.6" y="382" width="88" height="24" rx="8" fill="#1A47B8" fill-opacity=".08" stroke="#1A47B8" stroke-opacity=".35"/><text x="381.6" y="398.3" text-anchor="middle" font-size="12" fill="#1A47B8" class="mono">PDF report</text></g></g><rect x=".5" y=