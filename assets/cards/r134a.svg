.live{animation:live 1.6s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
.border{stroke-dasharray:60 1600;animation:run 9s linear infinite}
@keyframes run{to{stroke-dashoffset:-1660}}
