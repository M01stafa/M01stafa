fill="#A78BFA">IIR reference state · light &amp; dark themes</text></g><g class="fade" style="animation-delay:0.35s"><text x="28" y="288" font-size="15" fill="#94A3B8">Pressure–enthalpy (Mollier) diagram for R-134a with isotherms,</text></g><g class="fade" style="animation-delay:0.43s"><text x="28" y="310" font-size="15" fill="#94A3B8">isentropes and quality lines, plus a real-time cycle calculator</text></g><g class="fade" style="animation-delay:0.51s"><text x="28" y="332" font-size="15" fill="#94A3B8">and a multi-page PDF report.</text></g><g class="fade" style="animation-delay:.6s"><rect x="28" y="345" width="4" height="24" rx="2" fill="#D4AF37"/><text x="42" y="362" font-size="15" font-weight="600" fill="#E7CF7E">Built for the refrigeration course — used by my classmates</text></g><g class="chip" style="animation-delay:0.60s"><rect x="28" y="384" width="92" height="24" rx="6" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".28"/><text x="74" y="400.3" text-anchor="middle" font-size="12" fill="#A78BFA" class="mono">Vanilla JS</text></g><g class="chip" style="animation-delay:0.68s"><rect x="128" y="384" width="92" height="24" rx="6" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".28"/><text x="174" y="400.3" text-anchor="middle" font-size="12" fill="#A78BFA" class="mono">SVG engine</text></g><g class="chip" style="animation-delay:0.76s"><rect x="228" y="384" width="113.6" height="24" rx="6" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".28"/><text x="284.8" y="400.3" text-anchor="middle" font-size="12" fill="#A78BFA" class="mono">Thermo solver</text></g><g class="chip" style="animation-delay:0.84s"><rect x="349.6" y="384" width="92" height="24" rx="6" fill="#A78BFA" fill-opacity=".08" stroke="#A78BFA" stroke-opacity=".28"/><text x="395.6" y="400.3" text-anchor="middle" font-size="12" fill="#A78BFA" class="mono">PDF report</text></g></g><rect x=".5" y=".5" width="589" height="429" rx="18" fill="none" strok