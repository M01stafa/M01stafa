<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Alpha Board — open-source whiteboard, PDF annotator and circuit simulator"><title>Alpha Board — open-source whiteboard, PDF annotator and circuit simulator</title><style>text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace} 
.fade{opacity:0;animation:fadeUp .8s cubic-bezier(.2,0,0,1) forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chip{opacity:0;animation:fadeUp .5s ease forwards}
.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 2.4s ease forwards}
