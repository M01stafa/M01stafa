<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="590" height="430" viewBox="0 0 590 430" role="img" aria-label="Dukan3D Orders Archive"><title>Dukan3D Orders Archive</title><style>text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace} 
.fade{opacity:0;animation:fadeUp .8s cubic-bezier(.2,0,0,1) forwards}
