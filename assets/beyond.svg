nt team: their</text><text x="624.0" y="259" font-size="13" fill="#8FA2C4">weekly reports now take under 15</text><text x="624.0" y="278" font-size="13" fill="#8FA2C4">minutes instead of 2–3 hours of</text><text x="624.0" y="297" font-size="13" fill="#8FA2C4">effort.</text></g><g class="fade" style="animation-delay:0.65s"><rect x="900.0" y="52" width="276.0" height="260" rx="16" fill="#142343" stroke="#B88564" stroke-opacity=".35"/><rect x="900.0" y="52" width="276.0" height="110" rx="16" fill="#B88564" fill-opacity=".08"/><rect x="912.0" y="81.0" width="252.0" height="60" rx="30" fill="#B88564" fill-opacity=".06" stroke="#B88564" stroke-opacity=".5" stroke-width="2"/><g class="roll"><rect x="930.0" y="113.0" width="44" height="18" rx="5" fill="#B88564" fill-opacity=".9"/><circle cx="938.0" cy="133.0" r="5" fill="#050B17" stroke="#B88564"/><circle cx="966.0" cy="133.0" r="5" fill="#050B17" stroke="#B88564"/><circle cx="974.0" cy="119.0" r="4" fill="#D4AF37"/><path d="M976.0,119.0 L1050.0,93.0 L1050.0,137.0 Z" fill="#4F9ED5" class="beam"/></g><text x="916.0" y="192" font-size="11" font-weight="600" class="mono" fill="#D9A98A" letter-spacing="0.03em">TECHNICAL GUIDE</text><text x="916.0" y="216" font-size="17" font-weight="700" fill="#EDEAE1">Pipeline inspection robot</text><text x="916.0" y="240" font-size="13" fill="#8FA2C4">Guided a friends&#x27; team on parts,</text><text x="916.0" y="259" font-size="13" fill="#8FA2C4">build and code for a wireless</text><text x="916.0" y="278" font-size="13" fill="#8FA2C4">robot with camera and night vision</text><text x="916.0" y="297" font-size="13" fill="#8FA2C4">for oil pipelines.</text></g></svg>