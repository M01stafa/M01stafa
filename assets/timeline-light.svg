<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="584" viewBox="0 0 1200 584" role="img" aria-label="Timeline from photography in 2019 to Alpha Board in 2026"><title>Timeline from photography in 2019 to Alpha Board in 2026</title><style>text{font-family:Geist, 'Geist Sans', system-ui, -apple-system, 'Segoe UI', Ubuntu, Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} 
    .it{opacity:0;animation:in .7s cubic-bezier(.2,0,0,1) forwards}
    @keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
    .grow{stroke-dasharray:2000;stroke-dashoffset:2000;animation:grow 3.2s ease forwards}
    @keyframes grow{to{stroke-dashoffset:0}}
    .dot{animation:dp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#D4AF37"/><stop offset=".5" stop-color="#4F9ED5"/><stop offset="1" stop-color="#002C8C"/></linearGradient><clipPath id="pc"><rect width="1200" height="584" rx="16"/></clipPath></defs><g clip-path="url(#pc)"><rect width="1200" height="584" fill="#FFFFFF"/><rect x="0" y="0" width="1200" height="2" fill="url(#acc)"/></g><rect x=".5" y=".5" width="1199" height="583" rx="16" fill="none" stroke="#D5CEBE"/><text x="40" y="40" font-size="13" class="mono" fill="#5C677D" letter-spacing="0.03em" font-weight="600">FROM PIXELS TO PRODUCTS</text><line x1="250" y1="60" x2="250" y2="524" stroke="#5C677D" stroke-opacity=".35" stroke-width="2"/><defs><linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="70" x2="0" y2="514"><stop offset="0" stop-color="#8C5835"/><stop offset=".45" stop-color="#B89528"/><stop offset="1" stop-color="#1A63A0"/></linearGradient></defs><line x1="250" y1="60" x2="250" y2="524" stroke="url(#tg)" stroke-width="3" class="grow"/><g class="it" style="animation-delay:0.30s"><text x="220" y="76" text-anchor="end" font-size="16" font-weight="700" fill="#6B4226" class="mono">2019</text><circle cx="250" cy="70" r="7" fill="#FFFFFF" stroke="#8C5835" stroke-width="3"/><circle cx="250" cy="70" r="3" fill="#8C5835" class="dot" style="animation-delay:0.0s"/><text x="280" y="72" font-size="20" font-weight="700" fill="#0B132B">Photography</text><text x="280" y="94" font-size="14" fill="#5C677D">Lightroom · ~7 years behind the lens</text></g><g class="it" style="animation-delay:0.70s"><text x="220" y="150" text-anchor="end" font-size="16" font-weight="700" fill="#6B4226" class="mono">2021</text><circle cx="250" cy="144" r="7" fill="#FFFFFF" stroke="#8C5835" stroke-width="3"/><circle cx="250" cy="144" r="3" fill="#8C5835" class="dot" style="animation-delay:0.3s"/><text x="280" y="146" font-size="20" font-weight="700" fill="#0B132B">Graphic design</text><text x="280" y="168" font-size="14" fill="#5C677D">Posters, then a Photoshop wallpaper series</text></g><g class="it" style="animation-delay:1.10s"><text x="220" y="224" text-anchor="end" font-size="16" font-weight="700" fill="#1A47B8" class="mono">2023</text><circle cx="250" cy="218" r="7" fill="#FFFFFF" stroke="#1A47B8" stroke-width="3"/><circle cx="250" cy="218" r="3" fill="#1A47B8" class="dot" style="animation-delay:0.6s"/><text x="280" y="220" font-size="20" font-weight="700" fill="#0B132B">UI/UX + AI</text><text x="280" y="242" font-size="14" fill="#5C677D">Figma &amp; Framer sites (Vino, Zengeen) · ChatGPT · Helsinki AI course</text></g><g class="it" style="animation-delay:1.50s"><text x="220" y="298" text-anchor="end" font-size="16" font-weight="700" fill="#745B11" class="mono">2025</text><circle cx="250" cy="292" r="7" fill="#FFFFFF" stroke="#B89528" stroke-width="3"/><circle cx="250" cy="292" r="3" fill="#B89528" class="dot" style="animation-delay:0.9s"/><text x="280" y="294" font-size="20" font-weight="700" fill="#0B132B">Alpha Group</text><text x="280" y="316" font-size="14" fill="#5C677D">McKinsey course · founded Alpha Group (July) · final-year robotics projects</text></g><g class="it" style="animation-delay:1.90s"><text x="220" y="372" text-anchor="end" font-size="16" font-weight="700" fill="#1A63A0" class="mono">Jun 2026</text><circle cx="250" cy="366" r="7" fill="#FFFFFF" stroke="#1A63A0" stroke-width="3"/><circle cx="250" cy="366" r="3" fill="#1A63A0" class="dot" style="animation-delay:1.2s"/><text x="280" y="368" font-size="20" font-weight="700" fill="#0B132B">Psychrometric Chart</text><text x="280" y="390" font-size="14" fill="#5C677D">First site built with AI agents — used by my classmates</text></g><g class="it" style="animation-delay:2.30s"><text x="220" y="446" text-anchor="end" font-size="16" font-weight="700" fill="#1A63A0" class="mono">Jul–Oct 2026</text><circle cx="250" cy="440" r="7" fill="#FFFFFF" stroke="#1A63A0" stroke-width="3"/><circle cx="250" cy="440" r="3" fill="#1A63A0" class="dot" style="animation-delay:1.5s"/><text x="280" y="442" font-size="20" font-weight="700" fill="#0B132B">Refrigeration charts + Dukan3D</text><text x="280" y="464" font-size="14" fill="#5C677D">R-22 &amp; R-134a simulators · shop archive, orders board and store</text></g><g class="it" style="animation-delay:2.70s"><text x="220" y="520" text-anchor="end" font-size="16" font-weight="700" fill="#065F46" class="mono">Sep–Nov 2026</text><circle cx="250" cy="514" r="9" fill="#FFFFFF" stroke="#065F46" stroke-width="3"/><circle cx="250" cy="514" r="3" fill="#065F46" class="dot" style="animation-delay:1.8s"/><text x="280" y="516" font-size="20" font-weight="700" fill="#0B132B">Alpha Board</text><text x="280" y="538" font-size="14" fill="#5C677D">Open-source whiteboard + PDF + circuit workspace — live</text></g><circle cx="250" cy="514" r="9" fill="none" stroke="#065F46"><animate attributeName="r" values="9;24" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/></circle></svg>